version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: qatool-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: qatool_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: qatool-dashboard
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/qatool_db"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "qatool-super-secret-automation-key-2026"
    ports:
      - "3000:3000"

volumes:
  pgdata:
